<section class="rv-wrap">
  <style>
    .rv-wrap { padding: 12px; font-size: 13px; }
    .rv-hint { color: #b0b0b0; margin: 0 0 10px; line-height: 1.5; }
    .rv-list { max-height: 380px; overflow-y: auto; border: 1px solid #4a4a4a; border-radius: 6px; }
    .rv-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid #3a3a3a; }
    .rv-row:last-child { border-bottom: none; }
    .rv-name { flex: 0 0 180px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rv-tag { flex: 0 0 44px; font-size: 11px; padding: 1px 6px; border-radius: 8px; background: #3a6ea5; color: #fff; text-align: center; }
    .rv-tag.pl { background: #5a7a5a; }
    .rv-arrow { color: #8a8a8a; }
    .rv-sel { flex: 1; min-width: 0; }
    .rv-right { flex: 0 0 150px; text-align: right; }
    .rv-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  </style>
  <p class="rv-hint">{{hint}}</p>
  <div class="rv-list">{{{rows}}}</div>
  <footer class="rv-foot">
    <button type="button" class="rv-defaults">{{{allDefault}}}</button>
    <button type="button" class="rv-self">{{{allSelf}}}</button>
    <button type="button" class="rv-save">{{{save}}}</button>
  </footer>
</section>
